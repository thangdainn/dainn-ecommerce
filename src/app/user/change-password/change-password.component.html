    <div class="container">
        <p-toast></p-toast>
        <div class="row justify-content-center">
            <div class="card col-md-6">
                <p-stepper [linear]="true">

                    <p-stepperPanel header="Verify password">
                        <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
                            <form [formGroup]="fg">
                                <div class="d-flex justify-content-center">
                                    <div class="d-flex flex-column gap-2">
                                        <label for="password">Password</label>
                                        <p-password formControlName="oldPassword" [feedback]="false" class="w-100"
                                            styleClass="input-password-custom" [toggleMask]="true" />
                                        <div *ngIf="oldPassword?.invalid && (oldPassword?.touched || oldPassword?.dirty)">
                                            <small class="text-danger" *ngIf="oldPassword?.errors?.['required']">Password
                                                is required.</small>
                                        </div>
                                        <div *ngIf="inValidPw">
                                            <small class="text-danger">Invalid password.</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex pt-4 justify-content-end">
                                    <p-button label="Next" icon="pi pi-arrow-right" iconPos="right"
                                        styleClass="p-button-custom" [loading]="isLoading"
                                        (onClick)="onCheckPassword(nextCallback)" />
                                </div>
                            </form>
                        </ng-template>
                    </p-stepperPanel>

                    <p-stepperPanel header="New password">
                        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-index="index">
                            <form [formGroup]="fg">
                                <div class="row justify-content-center">
                                    <div class="col-md-12">
                                        <div class="form-block">
                                            <div class="d-flex flex-column gap-2 mb-3">
                                                <label for="password">New Password</label>
                                                <p-password formControlName="password" [feedback]="false" class="w-100"
                                                    styleClass="input-password-custom" [toggleMask]="true" />
                                                <div
                                                    *ngIf="password?.invalid && (password?.touched || password?.dirty)">
                                                    <small class="text-danger"
                                                        *ngIf="password?.errors?.['required']">Password
                                                        is required.</small>
                                                    <small class="text-danger"
                                                        *ngIf="password?.errors?.['minlength']">Password must
                                                        be at least 6 characters long.</small>
                                                </div>
                                            </div>
                                            <div class="d-flex flex-column gap-2 mb-3">
                                                <label for="rePassword">Confirm Password</label>
                                                <p-password formControlName="rePassword" [feedback]="false"
                                                    class="w-100" styleClass="input-password-custom"
                                                    [toggleMask]="true" />
                                                <div
                                                    *ngIf="fg.errors?.['passwordMisMatch'] && (rePassword?.dirty || rePassword?.touched)">
                                                    <small class="text-danger">Passwords do not match.</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex pt-4 justify-content-between">
                                    <p-button label="Back" icon="pi pi-arrow-left" styleClass="p-button-custom"
                                    (onClick)="prevCallback.emit()" />
                                    <p-button label="Submit" icon="pi pi-check" iconPos="right"
                                        styleClass="p-button-success-custom" [loading]="isLoading"
                                        (onClick)="onSubmit()" />
                                </div>
                            </form>

                        </ng-template>
                    </p-stepperPanel>
                </p-stepper>
            </div>
        </div>
    </div>
