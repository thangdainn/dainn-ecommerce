<div class="card px-4">
    <p-toast />
    <p-table [value]="roles" [tableStyle]="{ 'min-width': '50rem' }" [loading]="isLoading"
        [(selection)]="selectedRoles">
        <ng-template pTemplate="caption">
            <div class="row my-3">
                <div class="col-6 row justify-content-start">
                    <p-iconField iconPosition="left" class="ml-3">
                        <p-inputIcon>
                            <i class="pi pi-search"></i>
                        </p-inputIcon>
                        <input pInputText type="text" (change)="handleSearch($event)"
                            placeholder="Enter role name..." />
                    </p-iconField>
                </div>
                <div class="col-6 row justify-content-end">
                    <p-confirmPopup />
                    <p-button [disabled]="status == 0 || selectedRoles && selectedRoles.length == 0"
                        [loading]="isDeleting" icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
                        [raised]="true" (click)="confirmDelete($event)" />
                    <p-button (onClick)="openNew()" icon="pi pi-plus" [rounded]="true" [text]="true" [raised]="true"
                        class="ml-3" />
                </div>
            </div>


        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                <th pSortableColumn="name">
                    Name <p-sortIcon field="name" />
                </th>
                <th>Description</th>
                <th>
                    <!-- Status -->
                    <div class="d-flex align-items-center justify-content-between">
                        Status
                        <p-columnFilter field="status" type="boolean" display="menu" [showClearButton]="false"
                            [showApplyButton]="false">
                            <ng-template pTemplate="filter" let-value>
                                <p-dropdown [ngModel]="value" [options]="statuses" [(ngModel)]="status"
                                    (onChange)="filterStatus($event.value)" [autoDisplayFirst]="true"
                                    [showClear]="false" placeholder="Any">
                                    <ng-template let-option pTemplate="item">
                                        <p-tag [value]="option.value == 1 ? 'Enable' : 'Disable'"
                                            [severity]="getSeverity(option.value)" />
                                    </ng-template>
                                </p-dropdown>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>
                <th>
                    Action
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-role let-index="rowIndex">
            <tr style="border: none;">
                <td>
                    <p-tableCheckbox [value]="role" />
                </td>
                <td>{{role.name.split('_')[1]}}</td>
                <td>{{role.description}}</td>
                <td>
                    <p-tag [value]="role.status == 1 ? 'Enable' : 'Disable'" [severity]="getSeverity(role.status)" />
                </td>
                <td>
                    <p-button (onClick)="openEdit(role)" icon="pi pi-pencil" [rounded]="true" [text]="true"
                        [raised]="true" />
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center">No data available</td>
            </tr>
        </ng-template>
    </p-table>
    <div class="d-flex justify-content-center">
        <p-paginator (onPageChange)="onPageChange($event)" [first]="page * size" [rows]="size"
            [totalRecords]="totalElements" [rowsPerPageOptions]="[5, 10, 20]" />
    </div>
    <p-dialog [(visible)]="roleDialog" [style]="{ width: '450px' }" [header]="role.id ===0 ? 'Create' : 'Update'"
        [modal]="true" styleClass="p-fluid">

        <ng-template pTemplate="content">
            <form [formGroup]="editFormGroup">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" pInputText id="name" formControlName="name" [(ngModel)]="role.name" required
                        autofocus class="w-100" />
                    <div *ngIf="name?.invalid && (name?.touched || name?.dirty)">
                        <small class="text-danger" *ngIf="name?.errors?.['required']">Name
                            is required.</small>
                    </div>
                    <div *ngIf="roleIsExisted" class="mt-2">
                        <small class="text-danger">Role existed</small>
                    </div>
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" pInputTextarea formControlName="description"
                        [(ngModel)]="role.description" required rows="3" cols="20" class="w-100">
                    </textarea>
                    <div *ngIf="description?.invalid && (description?.touched || description?.dirty)">
                        <small class="text-danger" *ngIf="description?.errors?.['required']">Description
                            is required.</small>
                    </div>
                </div>

                <div class="field d-flex align-items-center" *ngIf="role.id !== 0">
                    <label for="status" class="mr-3">Status</label>
                    <p-inputSwitch [(ngModel)]="roleStatus" [ngModelOptions]="{standalone: true}">
                    </p-inputSwitch>
                </div>
            </form>

        </ng-template>

        <ng-template pTemplate="footer">
            <p-button label="Cancel" icon="pi pi-times" [text]="true" (onClick)="hideDialog()" />
            <p-button label="Save" icon="pi pi-check" [text]="true" (onClick)="saveEdit()" [loading]="isLoadingEdit" />
        </ng-template>
    </p-dialog>
</div>
