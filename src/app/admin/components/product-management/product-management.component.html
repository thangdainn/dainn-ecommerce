<div class="card px-4">
    <p-toast />
    <p-table [value]="products" [tableStyle]="{ 'min-width': '50rem' }" [loading]="isLoading"
        [(selection)]="selectedProducts">
        <ng-template pTemplate="caption">
            <div class="row my-3">
                <div class="col-6 row justify-content-start">
                    <p-iconField iconPosition="left" class="ml-3">
                        <p-inputIcon>
                            <i class="pi pi-search"></i>
                        </p-inputIcon>
                        <input pInputText type="text" (change)="handleSearch($event)"
                            placeholder="Enter name..." />
                    </p-iconField>
                </div>
                <div class="col-6 row justify-content-end">
                    <p-confirmPopup />
                    <p-button [disabled]="status == 0 || selectedProducts && selectedProducts.length == 0"
                        [loading]="isDeleting" icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
                        [raised]="true" (click)="confirmDelete($event)" />
                    <p-button routerLink="create" icon="pi pi-plus" [rounded]="true" [text]="true" [raised]="true"
                        class="ml-3" />
                </div>
            </div>


        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
                <th>#</th>
                <th pSortableColumn="name">
                    Name <p-sortIcon field="name" />
                </th>
                <th>Image</th>
                <th>Price</th>
                <th>Inventory</th>

                <th>
                    <div class="d-flex align-items-center justify-content-between">
                        Category
                        <p-columnFilter field="category" display="menu" [showMatchModes]="false" [showOperator]="false"
                            [showAddButton]="false" [showClearButton]="false" [showApplyButton]="false" class="ml-auto">
                            <ng-template pTemplate="filter" let-value>
                                <p-multiSelect [loading]="isLoadingCategories" [options]="categories" placeholder="Select" [(ngModel)]="selectedCates"
                                    (onChange)="getProductsPaginator()" optionLabel="name">
                                    <ng-template let-option pTemplate="item">
                                        <div class="inline-block vertical-align-middle">
                                            <span class="ml-1 mt-1">{{ option.name }}</span>
                                        </div>
                                    </ng-template>
                                </p-multiSelect>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>
                <th>
                    <div class="d-flex align-items-center justify-content-between">
                        Brand
                        <p-columnFilter field="representative" display="menu" [showMatchModes]="false"
                            [showOperator]="false" [showAddButton]="false" [showClearButton]="false"
                            [showApplyButton]="false" class="ml-auto">
                            <ng-template pTemplate="filter" let-value>
                                <p-multiSelect [loading]="isLoadingBrands" [options]="brands" placeholder="Select" [(ngModel)]="selectedBrands"
                                    (onChange)="getProductsPaginator()" optionLabel="name">
                                    <ng-template let-option pTemplate="item">
                                        <div class="inline-block vertical-align-middle">
                                            <span class="ml-1 mt-1">{{ option.name }}</span>
                                        </div>
                                    </ng-template>
                                </p-multiSelect>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>

                <th>
                    <!-- Status -->
                    <div class="d-flex align-items-center justify-content-between">
                        Status
                        <p-columnFilter field="status" type="boolean" display="menu" [showClearButton]="false"
                            [showApplyButton]="false">
                            <ng-template pTemplate="filter" let-value>
                                <p-dropdown [ngModel]="value" [options]="statuses" [(ngModel)]="status"
                                    (onChange)="filterStatus($event.value)" [autoDisplayFirst]="true"
                                    [showClear]="false" placeholder="Any">
                                    <ng-template let-option pTemplate="item">
                                        <p-tag [value]="option.value == 1 ? 'Enable' : 'Disable'"
                                            [severity]="getSeverity(option.value)" />
                                    </ng-template>
                                </p-dropdown>
                            </ng-template>
                        </p-columnFilter>
                    </div>
                </th>

                <th>
                    Action
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-product let-index="rowIndex" let-rowData="rowData">
            <tr style="border: none;">
                <td>
                    <p-tableCheckbox [value]="product" />
                </td>
                <td>{{ page*size + index + 1}}</td>
                <td>{{product.name}}</td>
                <td>
                    <img 
                    src="{{product.image}}" 
                    [alt]="product.name" 
                    width="50" 
                    class="shadow-4" />
                </td>
                <td>{{product.price | currency: 'VND'}}</td>
                <td>
                    <p-tag 
                    [value]="getInventoryStatus(product.stock)" 
                    [severity]="getInventorySeverity(product.stock)" />
                </td>
                <td>{{product.categoryName}}</td>
                <td>{{product.brandName}}</td>
                
                <td>
                    <p-tag [value]="product.status == 1 ? 'Enable' : 'Disable'" [severity]="getSeverity(product.status)" />
                </td>

                <td>
                    <p-button [routerLink]="product.code" icon="pi pi-pencil" [rounded]="true" [text]="true"
                        [raised]="true" />
                </td>
            </tr>
        </ng-template>
    </p-table>
    <div class="d-flex justify-content-center">
        <p-paginator (onPageChange)="onPageChange($event)" [first]="page * size" [rows]="size"
            [totalRecords]="totalElements" [rowsPerPageOptions]="[5, 10, 20]" />
    </div>
</div>
