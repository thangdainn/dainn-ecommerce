<div class="container">
    <p-toast></p-toast>
    <div class="mb-4">
        <h3>{{ isCreateMode() ? 'Create role' : 'Edit role'}}</h3>
    </div>
    <form [formGroup]="editFormGroup">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="form-block">
                    <div class="d-flex flex-column gap-2 mb-3">
                        <label for="name">Name</label>
                        <input pInputText id="name" formControlName="name" class="w-50" />
                        <div *ngIf="name?.invalid && (name?.touched || name?.dirty)">
                            <small class="text-danger" *ngIf="name?.errors?.['required']">Name
                                is required.</small>
                        </div>
                        <div *ngIf="roleIsExisted" class="mt-2">
                            <small class="text-danger">Role existed</small>
                        </div>
                    </div>
                    <div class="d-flex flex-column gap-2 mb-3">
                        <label for="description">Description</label>

                        <textarea id="description" class="w-50" rows="5" cols="30" formControlName="description"
                            pInputTextarea [autoResize]="true"></textarea>
                        <div *ngIf="description?.invalid && (description?.touched || description?.dirty)">
                            <small class="text-danger" *ngIf="description?.errors?.['required']">Description
                                is required.</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="d-flex pt-4 justify-content-start">
            <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-custom" routerLink="/admin/roles" class="mr-3" />
            <p-button label="Submit" icon="pi pi-check" iconPos="right" styleClass="p-button-success-custom"
                [loading]="isLoading" (onClick)="onSubmit()" />
        </div>
    </form>
</div>
