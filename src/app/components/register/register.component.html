<div class="content">
    <div class="container">
        <div class="row justify-content-center">
            <!-- <div class="col-md-6 order-md-2">
          <img src="images/undraw_file_sync_ot38.svg" alt="Image" class="img-fluid">
        </div> -->
            <div class="col-md-6 contents">
                <div class="row justify-content-center">
                    <div class="col-md-12">
                        <div class="form-block">
                            <div class="mb-4">
                                <h3>Register</h3>
                                <p class="mb-4">Lorem ipsum dolor sit amet elit. Sapiente sit aut eos consectetur
                                    adipisicing.</p>
                            </div>
                            <form [formGroup]="registerFormGroup" (ngSubmit)="onSubmit()">
                                <div class="form-group first">
                                    <label for="name">Name</label>
                                    <input formControlName="name" type="text" class="form-control" id="name">
                                    <div *ngIf="name?.invalid && (name?.touched || name?.dirty)">
                                        <small class="text-danger" *ngIf="name?.errors?.['required']">Name
                                            is required.</small>
                                    </div>
                                </div>
                                <div class="form-group first">
                                    <label for="email">Email</label>
                                    <input formControlName="email" type="email" class="form-control" id="email">
                                    <div *ngIf="email?.invalid && (email?.touched || email?.dirty)">
                                        <small class="text-danger" *ngIf="email?.errors?.['required']">Email
                                            is required.</small>
                                        <small class="text-danger" *ngIf="email?.errors?.['pattern']">Invalid
                                            email format.</small>
                                    </div>
                                    <div *ngIf="emailIsExisted" class="mt-2">
                                        <small class="text-danger">Email existed</small>
                                      </div>
                                </div>

                                <div class="form-group last mb-4">
                                    <label for="password">Password</label>
                                    <input formControlName="password" type="password" class="form-control"
                                        id="password">
                                    <div *ngIf="password?.invalid && (password?.touched || password?.dirty)">
                                        <small class="text-danger" *ngIf="password?.errors?.['required']">Password
                                            is required.</small>
                                        <small class="text-danger" *ngIf="password?.errors?.['minlength']">Password must
                                            be at least 6 characters long.</small>
                                    </div>
                                </div>
                                <div class="form-group last mb-4">
                                    <label for="rePassword">Confirm Password</label>
                                    <input formControlName="rePassword" type="password" class="form-control"
                                        id="rePassword">
                                    
                                    <div *ngIf="registerFormGroup.errors?.['passwordMisMatch'] && (rePassword?.dirty || rePassword?.touched)">
                                        <small class="text-danger">Passwords do not match.</small>
                                    </div>
                                </div>

                                <button type="submit" value="Register"
                                    class="btn btn-pill text-white btn-block btn-primary">Submit</button>

                                <div class="d-flex mt-3 align-items-center justify-content-end">
                                    <span class="ml-auto" style="font-size: 12px;">Already have an account?</span>
                                    <a routerLink="/login" class="forgot-pass">Sign in</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>
