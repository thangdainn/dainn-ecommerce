<div class="content">
    <div class="container pt-5">
        <div class="row justify-content-center">
            <div class="card col-md-6">
                <p-stepper [linear]="true">

                    <p-stepperPanel header="Enter email">
                        <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
                            <form [formGroup]="registerFormGroup">
                                <div class="d-flex justify-content-center">
                                    <div class="d-flex flex-column gap-2">
                                        <label for="email">Email</label>
                                        <input pInputText id="email" formControlName="email" />
                                        <div *ngIf="email?.invalid && (email?.touched || email?.dirty)">
                                            <small class="text-danger" *ngIf="email?.errors?.['required']">Email
                                                is required.</small>
                                            <small class="text-danger" *ngIf="email?.errors?.['pattern']">Invalid
                                                email format.</small>
                                        </div>
                                        <div *ngIf="emailIsExisted" class="mt-2">
                                            <small class="text-danger">Email existed</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex pt-4 justify-content-end">
                                    <p-button label="Next" icon="pi pi-arrow-right" iconPos="right"
                                        styleClass="p-button-custom" [loading]="isLoading"
                                        (onClick)="onCheckEmail(nextCallback)" />
                                </div>
                            </form>
                        </ng-template>
                    </p-stepperPanel>

                    <p-stepperPanel header="Verify email">
                        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                            let-index="index">
                            <div class="d-flex h-12rem justify-content-center">
                                <div class="d-flex flex-column gap-2 align-items-center">
                                    <p-inputOtp [(ngModel)]="otp" [length]="6"/>
                                    <div *ngIf="verifyOtp" class="mt-2">
                                        <small class="text-danger">OTP is invalid</small>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex pt-4 justify-content-between">
                                <p-button label="Back" icon="pi pi-arrow-left" styleClass="p-button-custom"
                                    (onClick)="prevCallback.emit()" />
                                <p-button label="Next" icon="pi pi-arrow-right" iconPos="right"
                                    styleClass="p-button-custom" [loading]="isLoading"
                                    (onClick)="onVerifyOtp(nextCallback)" />
                            </div>
                        </ng-template>
                    </p-stepperPanel>

                    <p-stepperPanel header="Register">
                        <ng-template pTemplate="content" let-prevCallback="prevCallback" let-index="index">
                            <form [formGroup]="registerFormGroup">
                                <div class="row justify-content-center">
                                    <div class="col-md-12">
                                        <div class="form-block">
                                            <div class="d-flex flex-column gap-2 mb-3">
                                                <label for="name">Name</label>
                                                <input pInputText id="name" formControlName="name" class="w-100" />
                                                <div *ngIf="name?.invalid && (name?.touched || name?.dirty)">
                                                    <small class="text-danger" *ngIf="name?.errors?.['required']">Name
                                                        is required.</small>
                                                </div>
                                            </div>

                                            <div class="d-flex flex-column gap-2 mb-3">
                                                <label for="password">Password</label>
                                                <p-password formControlName="password" [feedback]="false" class="w-100"
                                                    styleClass="input-password-custom" [toggleMask]="true" />
                                                <div
                                                    *ngIf="password?.invalid && (password?.touched || password?.dirty)">
                                                    <small class="text-danger"
                                                        *ngIf="password?.errors?.['required']">Password
                                                        is required.</small>
                                                    <small class="text-danger"
                                                        *ngIf="password?.errors?.['minlength']">Password must
                                                        be at least 6 characters long.</small>
                                                </div>
                                            </div>
                                            <div class="d-flex flex-column gap-2 mb-3">
                                                <label for="rePassword">Password</label>
                                                <p-password formControlName="rePassword" [feedback]="false"
                                                    class="w-100" styleClass="input-password-custom"
                                                    [toggleMask]="true" />
                                                <div
                                                    *ngIf="registerFormGroup.errors?.['passwordMisMatch'] && (rePassword?.dirty || rePassword?.touched)">
                                                    <small class="text-danger">Passwords do not match.</small>
                                                </div>
                                            </div>


                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex pt-4 justify-content-between">
                                    <p-button label="Cancel" icon="pi pi-times" styleClass="p-button-custom"
                                        routerLink="/login" />
                                    <p-button label="Submit" icon="pi pi-check" iconPos="right"
                                        styleClass="p-button-success-custom" [loading]="isLoading"
                                        (onClick)="onSubmit()" />
                                </div>
                            </form>

                        </ng-template>
                    </p-stepperPanel>
                </p-stepper>
            </div>
        </div>
    </div>
</div>
