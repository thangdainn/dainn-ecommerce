<section class="ftco-section">
    <div class="not-found-container w-100 d-flex justify-content-center align-items-center">
        <p-card [style]="{ width: '26rem', display: 'flex', flexDirection: 'column', alignItems: 'center' }">
            <ng-template pTemplate="header">
                <h1 class="text-4xl font-bold text-red-600 t-center">404 - Page Not Found</h1>
            </ng-template>
            <ng-template pTemplate="body">
                <p class="text-lg text-gray-700 mb-4">
                    The page <strong>{{ invalidUrl }}</strong> could not be found. Please check the URL or return to the
                    homepage.
                </p>
                <p-button label="Go to Homepage" icon="pi pi-home" (click)="goHome()" styleClass="p-button-custom" />
            </ng-template>
        </p-card>
    </div>
</section>
